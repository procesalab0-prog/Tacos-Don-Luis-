<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Repartidor · Tacos Don Luis</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F3F0E6;color:#211E15;font-family:system-ui,sans-serif}
    main{width:min(100%,420px);background:#FFFDF7;border:1px solid #E6DCC5;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(16,96,58,.13);text-align:center}
    .logo{width:62px;height:62px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#10603A;color:#fff;font-weight:800}
    h1{color:#10603A;margin:16px 0 8px;font-size:25px}p{color:#74694f;line-height:1.5;margin:0}
    .tag{display:inline-block;margin-top:18px;padding:7px 12px;border-radius:999px;background:#F2C230;color:#3a2c00;font-size:12px;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="logo">TDL</div>
    <h1>Portal del repartidor</h1>
    <p>La ruta ya está reservada. El acceso, los pedidos asignados, la navegación y la liquidación se activarán con el diseño de la fase 2.</p>
    <span class="tag">FASE 2 EN PREPARACIÓN</span>
  </main>
</body>
</html>
