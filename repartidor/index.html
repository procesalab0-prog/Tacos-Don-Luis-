const S={session:null,branch:null,role:null,profile:null,status:null,assignments:[],route:'list',open:null,busy:false};
const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];

const ICONS={

function ico(name,size=15,sw=2){return `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`}
// Supabase devuelve los errores de autenticación en "msg", no en "message".
// Al no leerlo, cualquier sesión vencida se mostraba como "No fue posible
// conectar", que parece falla de red y manda a revisar el internet en vano.
function traducirError(d,status){
  const cruda=d?.msg||d?.message||d?.error_description||d?.error||d?.hint||'';
  const codigo=d?.error_code||'';
  if(/refresh.?token|invalid.?grant|jwt expired|token.?expired/i.test(cruda+' '+codigo))
    return 'Tu sesión venció. Vuelve a iniciar turno.';
  if(/invalid login credentials/i.test(cruda)) return 'Correo o contraseña incorrectos.';
  if(status===401||status===403) return 'Tu acceso no está autorizado. Confirma con el dueño.';
  return cruda||'No fue posible conectar. Revisa tu señal e inténtalo de nuevo.';
}
async function api(path,opt={}){const {skipAuth=false,token:requestedToken,...fetchOpt}=opt,token=skipAuth?null:(requestedToken||S.session?.access_token);const r=await fetch(URL+path,{...fetchOpt,headers:{apikey:KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(traducirError(d,r.status));return d}
function expiresSoon(session){try{const p=JSON.parse(atob(session.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return !p.exp||p.exp*1000<=Date.now()+60000}catch(_){return true}}
async function freshSession(session){if(!session?.access_token)throw Error('Inicia sesión nuevamente');if(!expiresSoon(session))return session;if(!session.refresh_token)throw Error('Tu sesión venció. Inicia sesión nuevamente.');return api('/auth/v1/token?grant_type=refresh_token',{method:'POST',skipAuth:true,body:JSON.stringify({refresh_token:session.refresh_token})})}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2600)}
function initials(n='Repartidor'){return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function money(n){return Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'})}
function addr(o){const a=o.delivery_address||{};return [a.street,a.exterior_number,a.interior_number&&('Int. '+a.interior_number),a.neighborhood].filter(Boolean).join(' ')||'Dirección pendiente'}
async function login(){if(!$('#email').value.trim()||!$('#password').value)return toast('Escribe correo y contraseña');setBusy(true);try{const x=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});await restore(x,true)}catch(e){toast(e.message)}finally{setBusy(false)}}
async function restore(session,notify=false){try{session=await freshSession(session);const m=await api('/rest/v1/branch_memberships?user_id=eq.'+session.user.id+'&role=in.(driver,owner,admin)&is_active=eq.true&select=branch_id,role&limit=1',{token:session.access_token});if(!m[0])throw Error('Esta cuenta no tiene acceso al portal de entregas');S.session=session;S.branch=m[0].branch_id;S.role=m[0].role;localStorage.setItem('donLuisDriverSession',JSON.stringify(session));const p=await api('/rest/v1/profiles?id=eq.'+session.user.id+'&select=full_name,phone&limit=1');S.profile=p[0]||{full_name:session.user.email};await load();showApp();if(notify)toast(S.role==='driver'?'Turno iniciado':'Modo supervisión activado')}catch(e){localStorage.removeItem('donLuisDriverSession');localStorage.removeItem('donLuisStaffSession');S.session=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden');toast(e.message)}}
async function load(){if(!S.session)return;try{const filter=S.role==='driver'?'driver_user_id=eq.'+S.session.user.id+'&':'';const [st,a]=await Promise.all([S.role==='driver'?api('/rest/v1/driver_status?user_id=eq.'+S.session.user.id+'&select=*'):Promise.resolve([]),api('/rest/v1/driver_assignments?'+filter+'select=id,status,assigned_at,picked_up_at,delivered_at,incident_note,orders(id,folio,public_code,branch_id,status,payment_method,payment_status,guest_name,guest_phone,delivery_address,customer_notes,total,created_at,order_items(product_name,quantity,notes))&order=assigned_at.desc')]);S.status=st[0]||null;S.assignments=(a||[]).filter(x=>x.orders?.branch_id===S.branch);render()}catch(e){toast(e.message)}}
function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#driverName').textContent=S.profile?.full_name||'Repartidor';$('#avatar').textContent=initials(S.profile?.full_name);$('#shiftText').textContent=S.role==='driver'?'Turno activo':'Dueño · modo supervisión';render();clearInterval(S.poll);S.poll=setInterval(load,12000);clearInterval(S.sessionPoll);S.sessionPoll=setInterval(refreshCurrentSession,5*60*1000)}
async function refreshCurrentSession(){try{const session=await freshSession(S.session);if(session!==S.session){S.session=session;localStorage.setItem('donLuisDriverSession',JSON.stringify(session))}}catch(e){logout();toast(e.message||'Tu sesión venció. Inicia sesión nuevamente.')}}
function setBusy(v){S.busy=v;$('#loginBtn').disabled=v;$('#loginBtn').textContent=v?'Entrando…':'Iniciar turno'}
function active(a){return !['delivered','cancelled','incident'].includes(a.status)&&a.orders}
function meta(s){return s==='picked_up'||s==='on_the_way'?['En camino','#1f6f8b','#e6f4f8']:s==='delivered'?['Entregado','#10603A','#eaf4ec']:s==='incident'?['Incidencia','#b23a32','#fdeceb']:['Por recoger','#8a6d12','#fdf6e3']}
function render(){if(!S.session)return;$('#statusText').textContent=S.status?.is_available===false?'No disponible':'Disponible';$('#statusText').previousElementSibling.style.background=S.status?.is_available===false?'#f2a29c':'#8FD694';$('#back').classList.toggle('hidden',S.route!=='detail');$('#tabs').classList.toggle('hidden',S.route==='detail');all('.tab').forEach(x=>x.classList.toggle('active',x.dataset.route===S.route||(x.dataset.route==='list'&&S.route==='detail')));if(S.route==='detail')renderDetail();else if(S.route==='shift')renderShift();else renderList()}
function renderList(){const acts=S.assignments.filter(active),done=S.assignments.filter(a=>a.status==='delivered');const cash=done.filter(a=>a.orders?.payment_method==='cash').reduce((n,a)=>n+Number(a.orders.total),0);const availability=S.role==='driver'?`<div class="availability card"><div><b>Estás ${S.status?.is_available===false?'no disponible':'disponible'}</b><small>${S.status?.is_available===false?'No recibirás pedidos nuevos':'Estás recibiendo asignaciones'}</small></div><button id="availability" class="switch ${S.status?.is_available===false?'off':''}"></button></div>`:`<div class="availability card"><div><b>Modo supervisión</b><small>Como Dueño puedes revisar todas las entregas de la sucursal.</small></div></div>`;$('#main').innerHTML=`<div class="content">${availability}<div class="stats"><div class="stat card"><small>Asignados</small><strong>${acts.length}</strong></div><div class="stat card"><small>Entregados</small><strong>${done.length}</strong></div><div class="stat card"><small>Por liquidar</small><strong>${money(cash)}</strong></div></div><p class="section-title">Pedidos asignados</p><div class="orders">${acts.length?acts.map(card).join(''):`<div class="empty card">${ico('truck',34,1.7)}<b>Sin pedidos por ahora</b><span>Te avisaremos cuando te asignen uno.</span></div>`}</div></div>`;if($('#availability'))$('#availability').onclick=toggleAvailability;all('[data-open]').forEach(x=>x.onclick=()=>{S.open=x.dataset.open;S.route='detail';render()})}
function card(a){const o=a.orders,m=meta(a.status);return `<button class="order ${a.status==='picked_up'?'road':''}" data-open="${a.id}"><div class="order-head"><b>DL-${o.folio}</b><span class="pill" style="color:${m[1]};background:${m[2]}">${m[0]}</span><span class="distance">Entrega</span></div><div class="address"><span class="icon-row">${ico('pin',14)}<span>${addr(o)}</span></span></div><div class="order-foot"><span>${o.guest_name||'Cliente'}</span><span class="amount" style="color:${o.payment_status==='paid'?'#10603A':'#D6453D'}">${o.payment_status==='paid'?'Pagado':money(o.total)}</span></div></button>`}
function renderDetail(){const a=S.assignments.find(x=>x.id===S.open);if(!a?.orders){S.route='list';return render()}const o=a.orders,m=meta(a.status),phone=(o.guest_phone||'').replace(/\D/g,''),address=encodeURIComponent(addr(o));$('#main').innerHTML=`<div class="map"><button id="maps" class="icon-row">${ico('nav',16)}<span>Abrir en Maps</span></button></div><div class="detail"><h2>DL-${o.folio} <span class="pill" style="font-family:Rubik;color:${m[1]};background:${m[2]}">${m[0]}</span></h2><div class="card"><b class="icon-row">${ico('pin',15)}<span>${addr(o)}</span></b><p style="color:var(--muted);font-size:13px">${o.delivery_address?.reference||o.delivery_address?.references||'Sin referencias adicionales'}</p><b>${o.guest_name||'Cliente'}</b><small style="display:block;color:var(--muted)">${o.guest_phone||'Sin teléfono'}</small><div class="contact"><a class="call icon-row" style="justify-content:center" href="tel:${phone}">${ico('phone',15)}<span>Llamar</span></a><a class="wa" target="_blank" rel="noopener" href="https://wa.me/52${phone}">WhatsApp</a></div></div><div class="card"><p class="section-title">Pedido</p><div class="items">${(o.order_items||[]).map(i=>`<div><b>${i.quantity}×</b> ${i.product_name}${i.notes?` · ${i.notes}`:''}</div>`).join('')}</div>${o.customer_notes?`<div style="margin-top:10px;padding:9px 11px;border-radius:10px;background:#fdf6e3;color:#8a6d12;font-size:12px;font-weight:700"><span class="icon-row">${ico('cash',14)}<span>${o.customer_notes}</span></span></div>`:''}<div class="total"><div><small>A cobrar · ${o.payment_method==='cash'?'efectivo':'pedido pagado'}</small><br><strong style="color:${o.payment_status==='paid'?'#10603A':'#D6453D'}">${o.payment_status==='paid'?'Pagado':money(o.total)}</strong></div><div style="text-align:right"><small>Código de entrega</small><br><strong style="color:var(--green)">${o.public_code||o.folio}</strong></div></div></div><button id="advance" class="primary">${a.status==='picked_up'?'Cobrar y marcar entregado':'Marcar pedido recogido'}</button><div class="secondary-row"><button id="evidence" class="secondary icon-row" style="justify-content:center">${ico('camera',15)}<span>Evidencia</span></button><button id="incident" class="secondary danger icon-row" style="justify-content:center">${ico('warn',15)}<span>Incidencia</span></button></div></div>`;$('#maps').onclick=()=>open('https://www.google.com/maps/search/?api=1&query='+address,'_blank');$('#advance').onclick=()=>advance(a);$('#incident').onclick=()=>incidentModal(a);$('#evidence').onclick=()=>toast('La evidencia fotográfica se habilitará cuando Don Luis defina su regla de entrega')}
function renderShift(){const done=S.assignments.filter(a=>a.status==='delivered'&&a.orders),cash=done.filter(a=>a.orders.payment_method==='cash').reduce((n,a)=>n+Number(a.orders.total),0),paid=done.reduce((n,a)=>n+(a.orders.payment_method==='cash'?0:Number(a.orders.total)),0);$('#main').innerHTML=`<div class="content"><div class="turn-card"><h3>Liquidación de efectivo</h3><div class="row"><span>Entregas en efectivo</span><b>${money(cash)}</b></div><div class="row"><span>Entregas ya pagadas</span><b>${money(paid)}</b></div><div class="row total-row"><span>A entregar en caja</span><b>${money(cash)}</b></div><button id="settle" class="primary" style="background:var(--yellow);color:#3a2c00;margin-top:14px">Solicitar liquidación</button></div><p class="section-title">Historial del turno</p><div class="orders">${done.map(a=>`<div class="card" style="padding:13px 15px"><b>DL-${a.orders.folio} · Entregado</b><small style="display:block;color:var(--muted);margin-top:4px">${new Date(a.delivered_at||a.assigned_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})} · ${money(a.orders.total)}</small></div>`).join('')||'<div class="empty card">Aún no hay entregas terminadas.</div>'}</div></div>`;$('#settle').onclick=()=>solicitarLiquidacion(done,cash,paid)}
// Antes esto solo mostraba un aviso y no registraba nada, aunque decía "registrada".
// Ahora manda el corte por WhatsApp a la sucursal, que sí deja constancia.
function solicitarLiquidacion(done,cash,paid){
  if(!done.length){toast('Aún no tienes entregas terminadas en este turno');return;}
  const lineas=done.map(a=>`DL-${a.orders.folio} · ${a.orders.payment_method==='cash'?'efectivo':'pagado'} · ${money(a.orders.total)}`);
  const texto=['Solicito liquidación de mi turno.','',
    'Repartidor: '+(S.profile?.full_name||'Sin nombre'),
    'Entregas: '+done.length,'',
    ...lineas,'',
    'Efectivo a entregar: '+money(cash),
    'Ya pagadas: '+money(paid),
    'Fecha: '+new Date().toLocaleString('es-MX')].join('\n');
  window.open('https://wa.me/'+SUCURSAL_WA+'?text='+encodeURIComponent(texto),'_blank');
  toast('Abriendo WhatsApp con tu corte');
}
async function toggleAvailability(){try{const body={user_id:S.session.user.id,branch_id:S.branch,is_available:!(S.status?.is_available!==false),shift_started_at:S.status?.shift_started_at||new Date().toISOString(),updated_at:new Date().toISOString()};await api('/rest/v1/driver_status?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});await load()}catch(e){toast(e.message)}}
async function advance(a){try{const action=a.status==='picked_up'?'delivered':'picked_up';await api('/rest/v1/rpc/driver_advance_assignment',{method:'POST',body:JSON.stringify({p_assignment_id:a.id,p_action:action,p_incident_note:null})});toast(action==='delivered'?'¡Pedido entregado!':'Pedido recogido · en camino');S.route='list';S.open=null;await load()}catch(e){toast(e.message)}}
function incidentModal(a){const reasons=['Cliente no responde','Dirección incorrecta','Cliente canceló al llegar','No hay quien reciba'];$('#modal').innerHTML=`<div class="sheet"><h3>Reportar incidencia</h3>${reasons.map(r=>`<button class="incident" data-reason="${r}">${r}</button>`).join('')}<button class="secondary" style="width:100%;margin-top:10px" data-close>Cancelar</button></div>`;$('#modal').classList.remove('hidden');all('[data-reason]').forEach(x=>x.onclick=()=>reportIncident(a,x.dataset.reason));$('#modal [data-close]').onclick=()=>$('#modal').classList.add('hidden')}
async function reportIncident(a,reason){try{await api('/rest/v1/rpc/driver_advance_assignment',{method:'POST',body:JSON.stringify({p_assignment_id:a.id,p_action:'incident',p_incident_note:reason})});$('#modal').classList.add('hidden');S.route='list';toast('Incidencia reportada: '+reason);await load()}catch(e){toast(e.message)}}
function logout(){clearInterval(S.poll);clearInterval(S.sessionPoll);localStorage.removeItem('donLuisDriverSession');localStorage.removeItem('donLuisStaffSession');S.session=null;S.assignments=[];$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#password').value=''}
$('#loginBtn').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};$('#back').onclick=()=>{S.route='list';S.open=null;render()};all('.tab').forEach(x=>x.onclick=()=>{if(x.dataset.route==='logout')logout();else{S.route=x.dataset.route;S.open=null;render()}});let taps=0,tapTimer;function countTap(){clearTimeout(tapTimer);if(++taps>=6){taps=0;$('#egg').classList.remove('hidden');return}tapTimer=setTimeout(()=>taps=0,1200)}
// El easter egg se abre con 6 toques, tanto en el logo del login como en el avatar ya dentro.
$('#logoLogin').onclick=countTap;$('#avatar').onclick=countTap;$('#egg [data-close]').onclick=()=>$('#egg').classList.add('hidden');$('#versionTag').textContent='VERSIÓN '+VERSION;
const saved=JSON.parse(localStorage.getItem('donLuisDriverSession')||localStorage.getItem('donLuisStaffSession')||'null');if(saved?.access_token)restore(saved);
</script></body></html>
