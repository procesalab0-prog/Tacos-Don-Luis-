<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Repartidores · Tacos Don Luis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--green:#10603A;--green2:#178049;--cream:#F3F0E6;--paper:#FFFDF7;--line:#E6DCC5;--muted:#8a7f66;--red:#D6453D;--yellow:#F2C230;--blue:#1f6f8b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e7ddc8;color:#211E15;font-family:Rubik,system-ui,sans-serif}button,input{font:inherit}.shell{width:100%;max-width:440px;min-height:100dvh;margin:auto;background:var(--cream);box-shadow:0 0 60px #0002;display:flex;flex-direction:column}.hidden{display:none!important}
    .check{height:12px;background-image:repeating-conic-gradient(var(--green) 0 25%,transparent 0 50%);background-size:14px 14px}.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 24px;background:radial-gradient(900px 500px at 50% -10%,var(--green2),var(--green) 55%,#0b4a2d);color:white}.brand{text-align:center;margin-bottom:26px}.mark{width:70px;height:70px;border-radius:22px;background:var(--cream);color:var(--green);display:grid;place-items:center;font:700 22px Fredoka;margin:0 auto 14px;cursor:pointer}.brand h1{font:700 28px Fredoka;margin:0}.brand p{font-size:13.5px;color:#cfe3d3;margin:3px 0}.login-card,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px}.login-card{padding:22px 20px;color:#211E15}.field{width:100%;border:1.5px solid #e0d6bf;border-radius:12px;padding:13px 14px;font-size:14.5px;margin-bottom:10px;background:white}.primary{cursor:pointer;width:100%;border:0;border-radius:13px;padding:15px;background:var(--green);color:white;font:600 16px Fredoka}.login-card .primary{background:var(--red)}.hint{text-align:center;font-size:12px;color:#a99d80;margin-top:12px}.top{position:sticky;top:0;z-index:20;background:var(--green);color:white;padding:12px 16px;display:flex;align-items:center;gap:12px}.avatar{width:40px;height:40px;border-radius:50%;background:var(--yellow);color:var(--green);display:grid;place-items:center;font-weight:800}.who{flex:1;min-width:0}.who b{font:600 16px Fredoka}.who small{display:block;color:#9ec5a6}.status{display:flex;align-items:center;gap:6px;background:#ffffff28;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:#8FD694}.content{padding:16px 16px 100px;flex:1}.availability{padding:15px 17px;display:flex;align-items:center;gap:12px;margin-bottom:16px}.availability div{flex:1}.availability b{font-size:15px}.availability small{display:block;color:var(--muted);margin-top:2px}.switch{width:56px;height:32px;border:0;border-radius:999px;background:#28A54C;position:relative}.switch:after{content:'';position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:white}.switch.off{background:#cbbf9f}.switch.off:after{right:27px}.stats{display:flex;gap:10px;margin-bottom:16px}.stat{flex:1;padding:13px 14px}.stat:first-child{background:var(--green);color:white}.stat small{display:block;color:#9a8e70;font-weight:600;font-size:11px}.stat:first-child small{color:#9ec5a6}.stat strong{display:block;font:700 22px Fredoka;margin-top:2px}.section-title{text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-size:13px;font-weight:800;margin:0 0 10px}.orders{display:flex;flex-direction:column;gap:12px}.order{cursor:pointer;text-align:left;padding:14px 15px;border:2px solid #eadfca;background:var(--paper);border-radius:16px;box-shadow:0 3px 10px #0000000f}.order.road{border-color:#5FA8DA}.order-head,.order-foot{display:flex;align-items:center;gap:9px}.order-head b{font:600 16px Fredoka}.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}.distance{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700}.address{font-size:13px;line-height:1.4;margin:9px 0;color:#3a3120}.order-foot{border-top:1px dotted var(--line);padding-top:9px;justify-content:space-between;color:var(--muted);font-size:12.5px}.amount{font-weight:800}.empty{text-align:center;padding:44px 20px;color:#9a8e70}.empty b{font:600 16px Fredoka;color:var(--green);display:block}.back{background:#ffffff24;border:0;color:white;width:38px;height:38px;border-radius:11px;font-size:22px}.map{height:180px;display:grid;place-items:center;background-color:#dfe8d8;background-image:linear-gradient(#cfe0c6 1px,transparent 1px),linear-gradient(90deg,#cfe0c6 1px,transparent 1px);background-size:26px 26px}.map button{border:0;background:white;color:var(--blue);border-radius:12px;padding:11px 14px;font-weight:700;box-shadow:0 4px 12px #0002}.detail{padding:16px 16px 32px}.detail h2{font:700 22px Fredoka}.detail .card{padding:15px 16px;margin-bottom:13px}.contact{display:flex;gap:9px;margin-top:12px}.contact a{flex:1;text-align:center;padding:11px;border-radius:11px;font-size:13px;font-weight:700;text-decoration:none}.call{border:1.5px solid var(--line);color:var(--green);background:white}.wa{background:#25D366;color:white}.items{font-size:13.5px;line-height:1.8}.items b{color:var(--green)}.total{border-top:2px dotted #e0d6bf;margin-top:10px;padding-top:10px;display:flex;justify-content:space-between}.total strong{font:700 22px Fredoka}.secondary-row{display:flex;gap:9px;margin-top:10px}.secondary{flex:1;border:1.5px solid var(--line);background:white;border-radius:12px;padding:12px;font-weight:700;color:#5a4e35}.secondary.danger{color:#b23a32;border-color:#f3b6b1}.turn-card{background:#0f3d24;color:#eaf3ec;border-radius:18px;padding:20px;margin-bottom:16px}.turn-card h3{color:var(--yellow);font:600 16px Fredoka}.row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}.row.total-row{color:var(--yellow);font-weight:800;border-top:1px dashed #ffffff33;margin-top:6px;padding-top:12px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:30;width:min(100%,440px);display:flex;background:white;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}.tab{flex:1;border:0;background:none;color:#a99d80;padding:7px 4px;font-size:11px;font-weight:700}.tab.active{color:var(--green)}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:85px;z-index:90;background:var(--green);color:white;padding:12px 18px;border-radius:13px;max-width:90vw;font-size:14px;font-weight:600}.modal{position:fixed;inset:0;z-index:80;background:#140f0580;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:440px;background:var(--cream);border-radius:22px 22px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}.sheet h3{font:600 20px Fredoka;margin:0 4px 12px}.incident{width:100%;text-align:left;background:white;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;margin:4px 0;font-weight:600}.egg{align-items:center;padding:24px}.egg .sheet{border-radius:22px;text-align:center;max-width:340px}.version{display:inline-block;background:var(--cream);padding:6px 14px;border-radius:999px;color:var(--muted);font-size:12px;font-weight:700;margin:12px}.loading{opacity:.65;pointer-events:none}
  </style>
</head>
<body><div class="shell">
  <section id="login" class="login"><div class="brand"><div id="logoLogin" class="mark">TDL</div><h1>Repartidores</h1><p>Tacos Don Luis · Punto Cañada</p></div><div class="login-card"><input id="email" class="field" type="email" autocomplete="email" placeholder="Correo"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="loginBtn" class="primary">Iniciar turno</button><div class="hint">Acceso exclusivo para repartidores autorizados</div></div></section>
  <section id="app" class="hidden"><header class="top"><button id="back" class="back hidden">‹</button><div id="avatar" class="avatar">R</div><div class="who"><b id="driverName">Repartidor</b><small id="shiftText">Turno activo</small></div><span class="status"><i class="dot"></i><span id="statusText">Disponible</span></span></header><main id="main"></main><nav id="tabs" class="tabs"><button class="tab active" data-route="list">🚚<br>Pedidos</button><button class="tab" data-route="shift">🕐<br>Mi turno</button><button class="tab" data-route="logout">↪<br>Salir</button></nav></section>
  <div id="toast" class="toast hidden"></div><div id="modal" class="modal hidden"></div><div id="egg" class="modal egg hidden"><div class="sheet"><h3>🌮✨<br>¡Encontraste el Easter egg!</h3><p>Esta plataforma fue hecha por<br><a href="https://procesalab0-prog.github.io/ProcesaLabWeb/" target="_blank" rel="noopener"><b>ProcesaLab</b></a></p><span class="version">VERSIÓN 2.2.1</span><button class="primary" data-close>¡Va!</button></div></div>
</div><script>
const VERSION='2.2.1',URL='https://qvzgwjddeybktpwqcoko.supabase.co',KEY='sb_publishable_1pT7S6metcF0q3Vz-Z2ZZA_i8wzb7kD';
const S={session:null,branch:null,role:null,profile:null,status:null,assignments:[],route:'list',open:null,busy:false};
const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
async function api(path,opt={}){const token=opt.token||S.session?.access_token;const r=await fetch(URL+path,{...opt,headers:{apikey:KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.error_description||d?.hint||'No fue posible conectar');return d}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2600)}
function initials(n='Repartidor'){return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function money(n){return Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'})}
function addr(o){const a=o.delivery_address||{};return [a.street,a.exterior_number,a.interior_number&&('Int. '+a.interior_number),a.neighborhood].filter(Boolean).join(' ')||'Dirección pendiente'}
async function login(){if(!$('#email').value.trim()||!$('#password').value)return toast('Escribe correo y contraseña');setBusy(true);try{const x=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});await restore(x,true)}catch(e){toast(e.message)}finally{setBusy(false)}}
async function restore(session,notify=false){try{const m=await api('/rest/v1/branch_memberships?user_id=eq.'+session.user.id+'&role=in.(driver,owner,admin)&is_active=eq.true&select=branch_id,role&limit=1',{token:session.access_token});if(!m[0])throw Error('Esta cuenta no tiene acceso al portal de entregas');S.session=session;S.branch=m[0].branch_id;S.role=m[0].role;localStorage.setItem('donLuisDriverSession',JSON.stringify(session));const p=await api('/rest/v1/profiles?id=eq.'+session.user.id+'&select=full_name,phone&limit=1');S.profile=p[0]||{full_name:session.user.email};await load();showApp();if(notify)toast(S.role==='driver'?'Turno iniciado':'Modo supervisión activado')}catch(e){localStorage.removeItem('donLuisDriverSession');toast(e.message)}}
async function load(){if(!S.session)return;try{const filter=S.role==='driver'?'driver_user_id=eq.'+S.session.user.id+'&':'';const [st,a]=await Promise.all([S.role==='driver'?api('/rest/v1/driver_status?user_id=eq.'+S.session.user.id+'&select=*'):Promise.resolve([]),api('/rest/v1/driver_assignments?'+filter+'select=id,status,assigned_at,picked_up_at,delivered_at,incident_note,orders(id,folio,public_code,branch_id,status,payment_method,payment_status,guest_name,guest_phone,delivery_address,total,created_at,order_items(product_name,quantity,notes))&order=assigned_at.desc')]);S.status=st[0]||null;S.assignments=(a||[]).filter(x=>x.orders?.branch_id===S.branch);render()}catch(e){toast(e.message)}}
function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#driverName').textContent=S.profile?.full_name||'Repartidor';$('#avatar').textContent=initials(S.profile?.full_name);$('#shiftText').textContent=S.role==='driver'?'Turno activo':'Dueño · modo supervisión';render();clearInterval(S.poll);S.poll=setInterval(load,12000)}
function setBusy(v){S.busy=v;$('#loginBtn').disabled=v;$('#loginBtn').textContent=v?'Entrando…':'Iniciar turno'}
function active(a){return !['delivered','cancelled','incident'].includes(a.status)&&a.orders}
function meta(s){return s==='picked_up'||s==='on_the_way'?['En camino','#1f6f8b','#e6f4f8']:s==='delivered'?['Entregado','#10603A','#eaf4ec']:s==='incident'?['Incidencia','#b23a32','#fdeceb']:['Por recoger','#8a6d12','#fdf6e3']}
function render(){if(!S.session)return;$('#statusText').textContent=S.status?.is_available===false?'No disponible':'Disponible';$('#statusText').previousElementSibling.style.background=S.status?.is_available===false?'#f2a29c':'#8FD694';$('#back').classList.toggle('hidden',S.route!=='detail');$('#tabs').classList.toggle('hidden',S.route==='detail');all('.tab').forEach(x=>x.classList.toggle('active',x.dataset.route===S.route||(x.dataset.route==='list'&&S.route==='detail')));if(S.route==='detail')renderDetail();else if(S.route==='shift')renderShift();else renderList()}
function renderList(){const acts=S.assignments.filter(active),done=S.assignments.filter(a=>a.status==='delivered');const cash=done.filter(a=>a.orders?.payment_method==='cash').reduce((n,a)=>n+Number(a.orders.total),0);const availability=S.role==='driver'?`<div class="availability card"><div><b>Estás ${S.status?.is_available===false?'no disponible':'disponible'}</b><small>${S.status?.is_available===false?'No recibirás pedidos nuevos':'Estás recibiendo asignaciones'}</small></div><button id="availability" class="switch ${S.status?.is_available===false?'off':''}"></button></div>`:`<div class="availability card"><div><b>Modo supervisión</b><small>Como Dueño puedes revisar todas las entregas de la sucursal.</small></div></div>`;$('#main').innerHTML=`<div class="content">${availability}<div class="stats"><div class="stat card"><small>Asignados</small><strong>${acts.length}</strong></div><div class="stat card"><small>Entregados</small><strong>${done.length}</strong></div><div class="stat card"><small>Por liquidar</small><strong>${money(cash)}</strong></div></div><p class="section-title">Pedidos asignados</p><div class="orders">${acts.length?acts.map(card).join(''):'<div class="empty card">🚚<b>Sin pedidos por ahora</b><span>Te avisaremos cuando te asignen uno.</span></div>'}</div></div>`;if($('#availability'))$('#availability').onclick=toggleAvailability;all('[data-open]').forEach(x=>x.onclick=()=>{S.open=x.dataset.open;S.route='detail';render()})}
function card(a){const o=a.orders,m=meta(a.status);return `<button class="order ${a.status==='picked_up'?'road':''}" data-open="${a.id}"><div class="order-head"><b>DL-${o.folio}</b><span class="pill" style="color:${m[1]};background:${m[2]}">${m[0]}</span><span class="distance">Entrega</span></div><div class="address">📍 ${addr(o)}</div><div class="order-foot"><span>${o.guest_name||'Cliente'}</span><span class="amount" style="color:${o.payment_status==='paid'?'#10603A':'#D6453D'}">${o.payment_status==='paid'?'Pagado':money(o.total)}</span></div></button>`}
function renderDetail(){const a=S.assignments.find(x=>x.id===S.open);if(!a?.orders){S.route='list';return render()}const o=a.orders,m=meta(a.status),phone=(o.guest_phone||'').replace(/\D/g,''),address=encodeURIComponent(addr(o));$('#main').innerHTML=`<div class="map"><button id="maps">➤ Abrir en Maps</button></div><div class="detail"><h2>DL-${o.folio} <span class="pill" style="font-family:Rubik;color:${m[1]};background:${m[2]}">${m[0]}</span></h2><div class="card"><b>📍 ${addr(o)}</b><p style="color:var(--muted);font-size:13px">${o.delivery_address?.reference||o.delivery_address?.references||'Sin referencias adicionales'}</p><b>${o.guest_name||'Cliente'}</b><small style="display:block;color:var(--muted)">${o.guest_phone||'Sin teléfono'}</small><div class="contact"><a class="call" href="tel:${phone}">☎ Llamar</a><a class="wa" target="_blank" rel="noopener" href="https://wa.me/52${phone}">WhatsApp</a></div></div><div class="card"><p class="section-title">Pedido</p><div class="items">${(o.order_items||[]).map(i=>`<div><b>${i.quantity}×</b> ${i.product_name}${i.notes?` · ${i.notes}`:''}</div>`).join('')}</div><div class="total"><div><small>A cobrar · ${o.payment_method==='cash'?'efectivo':'pedido pagado'}</small><br><strong style="color:${o.payment_status==='paid'?'#10603A':'#D6453D'}">${o.payment_status==='paid'?'Pagado':money(o.total)}</strong></div><div style="text-align:right"><small>Código de entrega</small><br><strong style="color:var(--green)">${o.public_code||o.folio}</strong></div></div></div><button id="advance" class="primary">${a.status==='picked_up'?'Cobrar y marcar entregado':'Marcar pedido recogido'}</button><div class="secondary-row"><button id="evidence" class="secondary">📷 Evidencia</button><button id="incident" class="secondary danger">⚠ Incidencia</button></div></div>`;$('#maps').onclick=()=>open('https://www.google.com/maps/search/?api=1&query='+address,'_blank');$('#advance').onclick=()=>advance(a);$('#incident').onclick=()=>incidentModal(a);$('#evidence').onclick=()=>toast('La evidencia fotográfica se habilitará cuando Don Luis defina su regla de entrega')}
function renderShift(){const done=S.assignments.filter(a=>a.status==='delivered'&&a.orders),cash=done.filter(a=>a.orders.payment_method==='cash').reduce((n,a)=>n+Number(a.orders.total),0),paid=done.reduce((n,a)=>n+(a.orders.payment_method==='cash'?0:Number(a.orders.total)),0);$('#main').innerHTML=`<div class="content"><div class="turn-card"><h3>Liquidación de efectivo</h3><div class="row"><span>Entregas en efectivo</span><b>${money(cash)}</b></div><div class="row"><span>Entregas ya pagadas</span><b>${money(paid)}</b></div><div class="row total-row"><span>A entregar en caja</span><b>${money(cash)}</b></div><button id="settle" class="primary" style="background:var(--yellow);color:#3a2c00;margin-top:14px">Solicitar liquidación</button></div><p class="section-title">Historial del turno</p><div class="orders">${done.map(a=>`<div class="card" style="padding:13px 15px"><b>DL-${a.orders.folio} · Entregado</b><small style="display:block;color:var(--muted);margin-top:4px">${new Date(a.delivered_at||a.assigned_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})} · ${money(a.orders.total)}</small></div>`).join('')||'<div class="empty card">Aún no hay entregas terminadas.</div>'}</div></div>`;$('#settle').onclick=()=>toast('Solicitud registrada para revisión en caja')}
async function toggleAvailability(){try{const body={user_id:S.session.user.id,branch_id:S.branch,is_available:!(S.status?.is_available!==false),shift_started_at:S.status?.shift_started_at||new Date().toISOString(),updated_at:new Date().toISOString()};await api('/rest/v1/driver_status?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});await load()}catch(e){toast(e.message)}}
async function advance(a){try{const action=a.status==='picked_up'?'delivered':'picked_up';await api('/rest/v1/rpc/driver_advance_assignment',{method:'POST',body:JSON.stringify({p_assignment_id:a.id,p_action:action,p_incident_note:null})});toast(action==='delivered'?'¡Pedido entregado!':'Pedido recogido · en camino');S.route='list';S.open=null;await load()}catch(e){toast(e.message)}}
function incidentModal(a){const reasons=['Cliente no responde','Dirección incorrecta','Cliente canceló al llegar','No hay quien reciba'];$('#modal').innerHTML=`<div class="sheet"><h3>Reportar incidencia</h3>${reasons.map(r=>`<button class="incident" data-reason="${r}">${r}</button>`).join('')}<button class="secondary" style="width:100%;margin-top:10px" data-close>Cancelar</button></div>`;$('#modal').classList.remove('hidden');all('[data-reason]').forEach(x=>x.onclick=()=>reportIncident(a,x.dataset.reason));$('#modal [data-close]').onclick=()=>$('#modal').classList.add('hidden')}
async function reportIncident(a,reason){try{await api('/rest/v1/rpc/driver_advance_assignment',{method:'POST',body:JSON.stringify({p_assignment_id:a.id,p_action:'incident',p_incident_note:reason})});$('#modal').classList.add('hidden');S.route='list';toast('Incidencia reportada: '+reason);await load()}catch(e){toast(e.message)}}
function logout(){clearInterval(S.poll);localStorage.removeItem('donLuisDriverSession');S.session=null;S.assignments=[];$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#password').value=''}
$('#loginBtn').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};$('#back').onclick=()=>{S.route='list';S.open=null;render()};all('.tab').forEach(x=>x.onclick=()=>{if(x.dataset.route==='logout')logout();else{S.route=x.dataset.route;S.open=null;render()}});let taps=0,tapTimer;$('#logoLogin').onclick=()=>{clearTimeout(tapTimer);if(++taps>=6){taps=0;$('#egg').classList.remove('hidden')}tapTimer=setTimeout(()=>taps=0,1200)};$('#egg [data-close]').onclick=()=>$('#egg').classList.add('hidden');
const saved=JSON.parse(localStorage.getItem('donLuisDriverSession')||'null');if(saved?.access_token)restore(saved);
</script></body></html>
